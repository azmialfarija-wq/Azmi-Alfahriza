<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechZone Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/techzone-logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="tz-motion.css">
    <script src="tz-motion.js"></script>
</head>
<body class="tz-login">

    <!-- Latar: garis emas bergerak -->
    <svg class="tz-waves" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
            <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#ffd21f" stop-opacity="0"/>
                <stop offset=".45" stop-color="#ffd21f" stop-opacity=".95"/>
                <stop offset=".75" stop-color="#ff7a18" stop-opacity=".9"/>
                <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3a3f4a" stop-opacity="0"/>
                <stop offset=".5" stop-color="#9aa3b2" stop-opacity=".35"/>
                <stop offset="1" stop-color="#3a3f4a" stop-opacity="0"/>
            </linearGradient>
            <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
        </defs>
        <g class="wave-a">
            <path d="M-100 700 C 250 450, 500 820, 900 520 S 1500 250, 1750 380" stroke="url(#gold)" stroke-width="26" fill="none" filter="url(#glow)" opacity=".7"/>
            <path d="M-100 700 C 250 450, 500 820, 900 520 S 1500 250, 1750 380" stroke="url(#gold)" stroke-width="5" fill="none"/>
        </g>
        <g class="wave-b">
            <path d="M-100 560 C 300 300, 650 700, 1000 420 S 1450 160, 1750 240" stroke="url(#gold)" stroke-width="3" fill="none" opacity=".8"/>
            <path d="M-100 800 C 350 620, 700 900, 1100 650 S 1500 520, 1750 600" stroke="url(#gold)" stroke-width="10" fill="none" filter="url(#glow)" opacity=".45"/>
        </g>
        <g class="wave-c">
            <path d="M-100 250 C 300 520, 600 80, 1000 330 S 1400 600, 1750 480" stroke="url(#steel)" stroke-width="70" fill="none" opacity=".6"/>
            <path d="M-100 420 C 300 700, 700 260, 1100 520 S 1450 760, 1750 700" stroke="url(#steel)" stroke-width="40" fill="none" opacity=".5"/>
        </g>
    </svg>
    <!-- Latar: cahaya emas melayang (ringan, hanya transform) -->
    <div class="fx-orbs fx-fixed" aria-hidden="true">
        <i class="fx-orb" style="--x:-12%;--y:-8%;--s:560px;--a:.22;--d:22s;--dx:90px;--dy:60px;--depth:26"></i>
        <i class="fx-orb blue" style="--x:58%;--y:52%;--s:640px;--a:.26;--d:26s;--dx:-80px;--dy:-50px;--depth:-18"></i>
        <i class="fx-orb" style="--x:62%;--y:-14%;--s:380px;--a:.16;--d:18s;--dx:-50px;--dy:70px;--depth:14"></i>
        <i class="fx-dust" style="--x:14%;--y:70%;--d:9s;--dl:0s"></i><i class="fx-dust" style="--x:28%;--y:82%;--d:11s;--dl:-3s;--w:3px"></i>
        <i class="fx-dust" style="--x:72%;--y:76%;--d:10s;--dl:-5s"></i><i class="fx-dust" style="--x:86%;--y:64%;--d:12s;--dl:-8s;--w:3px"></i>
        <i class="fx-dust" style="--x:48%;--y:88%;--d:13s;--dl:-2s;--w:5px"></i>
    </div>
    <div class="tz-vignette"></div>

    <main class="tz-stage">
        <div class="tz-card" id="tz-card">

            <!-- Overlay transisi (ikon kaca saat pindah Masuk <-> Daftar) -->
            <div class="tz-switching" id="tz-switching"><div class="tz-glass-logo"><img src="images/techzone-logo.png" alt=""></div></div>

            <div class="tz-card-inner" id="tz-inner">
                <div class="tz-brand">
                    <img src="images/techzone-logo.png" alt="TechZone Computers" class="tz-logo">
                </div>

                <div class="tz-views" id="tz-views">
                <!-- ===== LOGIN ===== -->
                <section id="view-login" class="tz-view active">
                    <h1>Selamat <em>Datang</em></h1>
                    <p class="tz-sub">Masuk untuk mengakses akun TechZone kamu</p>

                    <form id="login-form" onsubmit="login(event)" autocomplete="on">
                        <label for="login-username">Username</label>
                        <div class="tz-field">
                            <i class="fa-regular fa-user"></i>
                            <input id="login-username" type="text" placeholder="Masukkan username" autocomplete="username" required>
                        </div>

                        <label for="login-password">Password</label>
                        <div class="tz-field">
                            <i class="fa-solid fa-lock"></i>
                            <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
                            <button type="button" class="tz-eye" data-eye="login-password" aria-label="Tampilkan password"><i class="fa-regular fa-eye"></i></button>
                        </div>

                        <div class="tz-row">
                            <label class="tz-check"><input type="checkbox" id="remember-me" checked><span></span> Ingat saya</label>
                            <a href="#" id="forgot-link">Lupa password?</a>
                        </div>

                        <div id="login-error" class="login-error hidden"></div>
                        <button class="tz-btn" type="submit">Masuk <i class="fa-solid fa-arrow-right"></i></button>
                    </form>
                    <p class="tz-switch">Belum punya akun? <a href="#" data-go="register">Daftar</a></p>
                </section>

                <!-- ===== DAFTAR ===== -->
                <section id="view-register" class="tz-view">
                    <h1>Buat <em>Akun</em></h1>
                    <p class="tz-sub">Gabung TechZone dan mulai belanja gadget</p>

                    <form id="register-form" autocomplete="off">
                        <label for="reg-name">Nama Lengkap</label>
                        <div class="tz-field">
                            <i class="fa-regular fa-user"></i>
                            <input id="reg-name" type="text" placeholder="Nama kamu" required>
                        </div>

                        <label for="reg-username">Username</label>
                        <div class="tz-field">
                            <i class="fa-solid fa-at"></i>
                            <input id="reg-username" type="text" placeholder="username_kamu" pattern="[A-Za-z0-9_.]{3,20}" title="3-20 karakter: huruf, angka, titik, underscore" required>
                        </div>

                        <div class="tz-two">
                            <div>
                                <label for="reg-pass">Password</label>
                                <div class="tz-field">
                                    <i class="fa-solid fa-lock"></i>
                                    <input id="reg-pass" type="password" placeholder="••••••" minlength="6" required>
                                    <button type="button" class="tz-eye" data-eye="reg-pass" aria-label="Tampilkan password"><i class="fa-regular fa-eye"></i></button>
                                </div>
                            </div>
                            <div>
                                <label for="reg-pass2">Konfirmasi</label>
                                <div class="tz-field">
                                    <i class="fa-solid fa-lock"></i>
                                    <input id="reg-pass2" type="password" placeholder="••••••" minlength="6" required>
                                    <button type="button" class="tz-eye" data-eye="reg-pass2" aria-label="Tampilkan password"><i class="fa-regular fa-eye"></i></button>
                                </div>
                            </div>
                        </div>

                        <div class="tz-row">
                            <label class="tz-check"><input type="checkbox" id="reg-agree" required><span></span> Saya setuju Syarat &amp; Kebijakan</label>
                        </div>

                        <div id="register-error" class="login-error hidden"></div>
                        <button class="tz-btn" type="submit">Buat Akun <i class="fa-solid fa-arrow-right"></i></button>
                    </form>

                    <p class="tz-switch">Sudah punya akun? <a href="#" data-go="login">Masuk</a></p>
                </section>
                </div>
            </div>

            <!-- Detail sudut kaca -->
            <i class="tz-corner tl"></i><i class="tz-corner br"></i>
        </div>

    </main>

    <script src="script.js"></script>
    <script src="login.js"></script>
</body>
</html>
